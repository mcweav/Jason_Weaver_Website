<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <main class="auth-wrath">
        <section class="card" aria-labelledby="register-title">
            <div class="header">
                <div class="logo" aria-hidden="true">EA</div>
                <div class="title">
                    <h1 id="register-title">Create Your Account</h1>
                    <p>Start your journey in minutes!</p>
                </div>
            </div>
            <form action="/register" method="post" class="form" novalidate>
                <div class="row two">
                    <div>
                        <label for="firstName" class="label">First Name</label>
                        <input type="text" class="input" id="firstName" name="firstName" placeholder="Jane" autocomplete="given-name" required>
                    </div>
                    <div>
                        <label for="lastName" class="label">Last Name</label>
                        <input type="text" class="input" id="lastName" name="lastName" placeholder="Doe" autocomplete="family-name" required>
                    </div>
                </div>
                <div>
                    <label for="email" class="label">Email</label>
                    <input type="email" class="input" id="email" name="email" placeholder="you@email.com" autocomplete="email" required>
                </div>
                <div>
                    <label for="password" class="label">Password</label>
                    <input type="password" class="input" id="password" name="password" placeholder="Atleast eight characters" autocomplete="new-password" minlength="8" required>
                    <p class="hint exsmall">Use eight plus characters. Mix letters and numbers for better security.</p>
                </div>
                <div>
                    <label for="confirm" class="label">Confirm Password</label>
                    <input type="password" class="input" id="confirm" name="confirm" placeholder="Re-enter your password" minlength="8" required>
                    <p class="hint exsmall">Make sure this matches the password above.</p>
                </div>
                <label class="remember">
                    <input type="checkbox" class="checkbox" name="terms" required>
                    I agree to the
                    <a href="/terms" class="exsmall" style="margin-left: 6px;">Terms</a>
                </label>
                <button class="btn" type="submit">Create Account</button>
                <div class="divider"></div>
                <p class="alt">
                    Already have an account? <a href="register.html">Login</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
